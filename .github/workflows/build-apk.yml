name: Build MediTimer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate stable signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MEDITIMER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MEDITIMER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEDITIMER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEDITIMER_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing MEDITIMER_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing MEDITIMER_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing MEDITIMER_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing MEDITIMER_KEY_PASSWORD"; exit 1; }

      - name: Restore stable signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.MEDITIMER_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/meditimer-release.jks"
          echo "MEDITIMER_KEYSTORE_PATH=$RUNNER_TEMP/meditimer-release.jks" >> "$GITHUB_ENV"

      - name: Verify expected signing key
        env:
          STORE_PASSWORD: ${{ secrets.MEDITIMER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEDITIMER_KEY_ALIAS }}
        run: |
          EXPECTED="F3:FB:94:48:03:27:91:84:0E:7D:EC:37:10:89:8F:91:C2:90:DE:A0:50:7B:D6:1D:D1:AA:9D:BB:45:57:41:34"

          ACTUAL=$(keytool -exportcert \
            -alias "$KEY_ALIAS" \
            -keystore "$MEDITIMER_KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -rfc | openssl x509 -noout -fingerprint -sha256 | sed 's/^.*=//')

          echo "Signing certificate SHA-256: $ACTUAL"

          test "$ACTUAL" = "$EXPECTED" || {
            echo "ERROR: signing key is not the stable MediTimer key"
            exit 1
          }

      - name: Build signed release APK
        env:
          MEDITIMER_STORE_PASSWORD: ${{ secrets.MEDITIMER_STORE_PASSWORD }}
          MEDITIMER_KEY_ALIAS: ${{ secrets.MEDITIMER_KEY_ALIAS }}
          MEDITIMER_KEY_PASSWORD: ${{ secrets.MEDITIMER_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MediTimer-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
